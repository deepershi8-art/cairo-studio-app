<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RATEENA SOUND</title>
<style>
  :root { --brass: #b08d57; --black: #0d0d0d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--black);
    color: var(--brass);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3.5rem;
    text-align: center;
  }
  .logo {
    width: min(62vw, 340px);
    height: auto;
    display: block;
  }
  .buttons {
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: transparent;
    border: 1px solid rgba(176,141,87,0.5);
    color: var(--brass);
    padding: 0.9rem 2.2rem;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    border-radius: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  button:disabled {
    opacity: 0.35;
    cursor: default;
  }
  button.primary:not(:disabled):hover,
  button.primary:focus-visible {
    background: var(--brass);
    color: var(--black);
  }
</style>
</head>
<body>
  <div class="landing">
    <img src="rateena-logo.png" alt="RATEENA SOUND" class="logo">
    <div class="buttons">
      <button disabled>Management</button>
      <button class="primary" id="rateena">Rateena Sound</button>
    </div>
  </div>
  <script>
    document.getElementById('rateena').addEventListener('click', () => {
      // Intentionally does nothing for now
    });
  </script>
</body>
</html>
