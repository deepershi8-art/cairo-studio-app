<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cairo Audio Production Centre</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --graphite: #141416;
    --paper: #f3efe6;
    --brass: #b08d57;
    --brass-dim: rgba(176, 141, 87, 0.35);
    --brass-soft: rgba(176, 141, 87, 0.15);
    --off-white: #e8e4dc;
    --near-black: #1a1917;
    --muted: rgba(232, 228, 220, 0.55);
    --muted-dark: rgba(26, 25, 23, 0.55);
    --panel-shadow: 0 24px 64px rgba(0,0,0,0.35);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --max: 1180px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--graphite);
    color: var(--off-white);
    font-family: "DM Sans", system-ui, sans-serif;
    font-weight: 300;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: var(--max);
    margin: 0 auto;
    position: relative;
  }
  .rail {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.15rem 2rem 0.9rem;
    border-bottom: 1px solid rgba(176, 141, 87, 0.18);
    flex-shrink: 0;
    z-index: 20;
    gap: 1rem;
  }
  .rail-brand {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 0.9rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass);
    font-weight: 500;
    flex-shrink: 0;
  }
  .chapters {
    display: flex;
    gap: 0.05rem;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chapters::-webkit-scrollbar { display: none; }
  .chapter {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    padding: 0.5rem 0.85rem;
    color: var(--muted);
    transition: color 0.5s var(--ease), background 0.5s var(--ease), opacity 0.4s var(--ease);
    border-radius: 2px;
    position: relative;
    white-space: nowrap;
  }
  .chapter:hover { color: var(--off-white); }
  .chapter.active { color: var(--paper); }
  .chapter[aria-disabled="true"] {
    opacity: 0.38;
    cursor: default;
    pointer-events: none;
  }
  .chapter .num {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    color: var(--brass);
    opacity: 0.7;
  }
  .chapter.active .num { opacity: 1; }
  .chapter .label {
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 400;
  }
  .chapter.active::after {
    content: "";
    position: absolute;
    left: 0.85rem;
    right: 0.85rem;
    bottom: 0;
    height: 1px;
    background: var(--brass);
    transform-origin: left;
    animation: underlineIn 0.6s var(--ease) forwards;
  }
  @keyframes underlineIn {
    from { transform: scaleX(0); opacity: 0; }
    to { transform: scaleX(1); opacity: 1; }
  }
  .stage { flex: 1; position: relative; overflow: hidden; }
  .screen {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px);
    transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
    display: flex;
    overflow: hidden;
  }
  .screen.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .screen.essay-screen {
    overflow-x: hidden;
    overflow-y: auto;
    flex-direction: column;
    display: block;
    -webkit-overflow-scrolling: touch;
  }
  .screen.essay-screen:not(.active) { display: block; }

  /* PROLOGUE */
  .prologue { display: grid; grid-template-columns: 1.05fr 1fr; gap: 0; }
  .tonal {
    position: relative;
    background:
      radial-gradient(ellipse 80% 60% at 30% 70%, rgba(176,141,87,0.22) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 75% 25%, rgba(176,141,87,0.12) 0%, transparent 50%),
      linear-gradient(165deg, #1c1b1e 0%, #0e0e10 45%, #1a1714 100%);
    overflow: hidden;
  }
  .tonal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(-18deg, transparent, transparent 48px, rgba(176,141,87,0.03) 48px, rgba(176,141,87,0.03) 49px);
  }
  .tonal-mark {
    position: absolute; bottom: 2.5rem; left: 2.5rem;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 7rem; line-height: 0.85;
    color: rgba(176,141,87,0.12); letter-spacing: -0.02em; user-select: none;
  }
  .tonal-ring {
    position: absolute; width: 280px; height: 280px;
    border: 1px solid rgba(176,141,87,0.18); border-radius: 50%;
    top: 18%; left: 22%;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .tonal-ring::after {
    content: ""; position: absolute; inset: 28px;
    border: 1px solid rgba(176,141,87,0.1); border-radius: 50%;
  }
  @keyframes drift {
    from { transform: translate(0, 0) rotate(0deg); }
    to { transform: translate(18px, -12px) rotate(8deg); }
  }
  .prologue-copy {
    padding: 3.5rem 3.25rem 3rem;
    display: flex; flex-direction: column; justify-content: center;
    background: var(--graphite);
  }
  .eyebrow {
    font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--brass); font-weight: 400; margin-bottom: 1.5rem;
  }
  .title {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400;
    font-size: clamp(2.4rem, 4.2vw, 3.35rem); line-height: 1.12;
    letter-spacing: -0.01em; color: var(--paper); margin-bottom: 0.35rem;
  }
  .chapter-tag {
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic;
    font-size: 1.35rem; color: var(--brass); margin-bottom: 1.75rem;
  }
  .lede {
    color: var(--muted); max-width: 36ch; font-size: 0.98rem;
    margin-bottom: 2.25rem; font-weight: 300;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 2.75rem; }
  .chip {
    border: 1px solid var(--brass-dim); color: var(--off-white);
    padding: 0.45rem 0.95rem; font-size: 0.72rem; letter-spacing: 0.06em;
    border-radius: 100px; background: var(--brass-soft);
    transition: border-color 0.4s var(--ease), background 0.4s var(--ease);
  }
  .chip:hover { border-color: var(--brass); background: rgba(176,141,87,0.22); }
  .btn-begin {
    align-self: flex-start; border: 1px solid var(--brass); color: var(--brass);
    padding: 0.85rem 2.2rem; font-size: 0.72rem; letter-spacing: 0.22em;
    text-transform: uppercase; border-radius: 1px;
    transition: background 0.5s var(--ease), color 0.5s var(--ease), transform 0.4s var(--ease);
  }
  .btn-begin:hover { background: var(--brass); color: var(--graphite); transform: translateY(-1px); }

  /* FRAMING */
  .framing { background: var(--paper); color: var(--near-black); }
  .essay-inner { max-width: 820px; margin: 0 auto; padding: 2.75rem 2.5rem 4rem; }
  .framing .essay-inner { max-width: 860px; }
  .essay-kicker {
    font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--brass); margin-bottom: 0.85rem;
  }
  .essay-title {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400;
    font-size: clamp(2.1rem, 3.5vw, 2.85rem); line-height: 1.15;
    color: var(--near-black); margin-bottom: 0.4rem;
  }
  .essay-sub {
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic;
    font-size: 1.2rem; color: var(--brass); margin-bottom: 2.5rem;
  }
  .essay-section { margin-bottom: 2.75rem; padding-top: 0.25rem; }
  .essay-section h3 {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.45rem;
    font-weight: 500; color: var(--near-black); margin-bottom: 1rem;
  }
  .essay-section p {
    font-size: 0.95rem; color: rgba(26,25,23,0.78); line-height: 1.7;
    margin-bottom: 0.95rem; font-weight: 300; max-width: 62ch;
  }
  .essay-section p:last-child { margin-bottom: 0; }
  .essay-section ul { list-style: none; margin: 0.75rem 0 0; padding: 0; }
  .essay-section li {
    position: relative; padding-left: 1.15rem; margin-bottom: 0.65rem;
    font-size: 0.92rem; color: rgba(26,25,23,0.78); line-height: 1.6; max-width: 62ch;
  }
  .essay-section li::before {
    content: ""; position: absolute; left: 0; top: 0.65em;
    width: 5px; height: 1px; background: var(--brass);
  }
  .tests { display: grid; gap: 0.85rem; margin: 1.25rem 0 1.5rem; }
  .test-card {
    display: grid; grid-template-columns: 2.2rem 1fr; gap: 0.85rem;
    padding: 1.1rem 1.25rem; background: rgba(20,20,22,0.03);
    border: 1px solid rgba(26,25,23,0.08); border-radius: 2px;
  }
  .test-card .tn {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.15rem;
    color: var(--brass); line-height: 1.2;
  }
  .test-card strong {
    display: block; font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.15rem; font-weight: 500; color: var(--near-black); margin-bottom: 0.3rem;
  }
  .test-card p { margin: 0 !important; font-size: 0.88rem !important; max-width: none !important; }
  .benchmark {
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic;
    font-size: 1.05rem; color: rgba(26,25,23,0.65);
    border-left: 1px solid var(--brass); padding-left: 1.1rem;
    margin: 1.25rem 0 0; max-width: 58ch; line-height: 1.5;
  }
  .scope-table { width: 100%; border-collapse: collapse; margin: 1.25rem 0 1rem; font-size: 0.85rem; }
  .scope-table th {
    text-align: left; font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted-dark); font-weight: 400; padding: 0.55rem 0.75rem 0.55rem 0;
    border-bottom: 1px solid rgba(26,25,23,0.14);
  }
  .scope-table td {
    padding: 0.85rem 0.75rem 0.85rem 0; border-bottom: 1px solid rgba(26,25,23,0.08);
    vertical-align: top; color: rgba(26,25,23,0.78); line-height: 1.45;
  }
  .scope-table td:first-child {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.05rem;
    color: var(--near-black); font-weight: 500; min-width: 8rem;
  }
  .scope-table .depth {
    font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--brass); white-space: nowrap;
  }
  .work-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.85rem; margin: 1.25rem 0 1rem; }
  .work-card {
    padding: 1.15rem 1.2rem; border: 1px solid rgba(26,25,23,0.1);
    border-radius: 2px; background: #faf7f0;
  }
  .work-card h4 {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.1rem;
    font-weight: 500; margin-bottom: 0.45rem; color: var(--near-black);
  }
  .work-card p { margin: 0 !important; font-size: 0.85rem !important; max-width: none !important; }
  .honest-limit {
    margin-top: 1rem; padding: 1rem 1.2rem; background: rgba(176,141,87,0.08);
    border-radius: 2px; font-size: 0.9rem; color: rgba(26,25,23,0.8);
    line-height: 1.55; max-width: 62ch;
  }
  .honest-limit strong {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; color: var(--near-black);
  }
  .building-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.15rem; }
  .building-card {
    padding: 1.15rem 1.2rem; border: 1px solid rgba(26,25,23,0.08);
    border-radius: 2px; background: rgba(20,20,22,0.025);
  }
  .building-card h4 {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.1rem;
    font-weight: 500; margin-bottom: 0.65rem; color: var(--near-black);
  }
  .building-card ul { margin-top: 0.35rem; }
  .edges {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 0.65rem; margin: 1.15rem 0;
  }
  .edge { padding: 0.95rem 1rem; border: 1px solid rgba(26,25,23,0.1); border-radius: 2px; }
  .edge strong {
    display: block; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--brass); margin-bottom: 0.35rem; font-weight: 400;
  }
  .edge span { font-size: 0.85rem; color: rgba(26,25,23,0.72); line-height: 1.45; }
  .roadmap { counter-reset: stage; list-style: none; margin: 1rem 0 0; padding: 0; }
  .roadmap li {
    counter-increment: stage; padding-left: 2.4rem; position: relative;
    margin-bottom: 0.55rem; font-size: 0.9rem; color: rgba(26,25,23,0.78);
    line-height: 1.5; max-width: none;
  }
  .roadmap li::before {
    content: counter(stage); position: absolute; left: 0; top: 0;
    width: 1.6rem; font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 0.95rem; color: var(--brass); background: none; height: auto;
  }
  .glossary {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.75rem 1.25rem; margin-top: 1.15rem; padding-top: 1.5rem;
    border-top: 1px solid rgba(26,25,23,0.1);
  }
  .gloss-item dt {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 1rem;
    font-weight: 500; color: var(--near-black); margin-bottom: 0.2rem;
  }
  .gloss-item dd { font-size: 0.8rem; color: rgba(26,25,23,0.62); line-height: 1.45; }
  .essay-continue {
    margin-top: 2.5rem; padding-top: 1.75rem;
    border-top: 1px solid rgba(26,25,23,0.1);
  }
  .btn-continue {
    display: inline-flex; align-items: center; gap: 0.65rem;
    border: 1px solid var(--brass); color: var(--brass);
    padding: 0.85rem 1.85rem; font-size: 0.72rem; letter-spacing: 0.18em;
    text-transform: uppercase; border-radius: 1px;
    transition: background 0.5s var(--ease), color 0.5s var(--ease), transform 0.4s var(--ease);
  }
  .btn-continue:hover { background: var(--brass); color: var(--graphite); transform: translateY(-1px); }
  .framing .btn-continue { color: var(--near-black); border-color: var(--near-black); }
  .framing .btn-continue:hover { background: var(--near-black); color: var(--paper); }

  /* SUITE */
  .suite { background: var(--graphite); flex-direction: column; }
  .suite-plan-row {
    display: grid; grid-template-columns: 1fr 300px; gap: 0;
    min-height: min(58vh, 520px); flex-shrink: 0;
  }
  .suite-main {
    padding: 1.75rem 2rem 1.5rem; display: flex; flex-direction: column; min-width: 0;
  }
  .suite-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 1.15rem; gap: 1.5rem;
  }
  .suite-header .title { font-size: clamp(1.7rem, 2.8vw, 2.25rem); margin-bottom: 0.2rem; }
  .suite-subtitle { color: var(--muted); font-size: 0.85rem; max-width: 48ch; line-height: 1.5; }
  .toggle {
    display: flex; border: 1px solid var(--brass-dim); border-radius: 2px;
    overflow: hidden; flex-shrink: 0;
  }
  .toggle button {
    padding: 0.55rem 1rem; font-size: 0.68rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); transition: all 0.4s var(--ease);
    white-space: nowrap;
  }
  .toggle button.active { background: var(--brass); color: var(--graphite); }
  .toggle button:not(.active):hover { color: var(--off-white); background: var(--brass-soft); }
  .plan-wrap {
    flex: 1; background: var(--paper); border-radius: 2px; padding: 1.15rem 1.35rem;
    display: flex; flex-direction: column; min-height: 0; box-shadow: var(--panel-shadow);
  }
  .plan-note {
    font-size: 0.7rem; color: var(--muted-dark); letter-spacing: 0.04em;
    margin-bottom: 0.75rem; min-height: 1.2em;
  }
  .plan-svg { flex: 1; width: 100%; height: 100%; min-height: 280px; }
  .room { cursor: pointer; }
  .room rect, .room path {
    fill: #ebe6db; stroke: #c4bba8; stroke-width: 1.5;
    transition: fill 0.45s var(--ease), stroke 0.45s var(--ease);
  }
  .room:hover rect, .room:hover path { fill: #e4d9c4; stroke: var(--brass); }
  .room.selected rect, .room.selected path { fill: #ddd2b8; stroke: var(--brass); stroke-width: 2; }
  .room.preferred rect { stroke: var(--brass); stroke-dasharray: 4 3; }
  .room text {
    font-family: "DM Sans", sans-serif; font-size: 11px; fill: var(--near-black);
    letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; font-weight: 400;
  }
  .room .sub { font-size: 9px; fill: var(--muted-dark); letter-spacing: 0.04em; text-transform: none; }
  .side-panel {
    background: var(--paper); color: var(--near-black); padding: 2rem 1.65rem;
    display: flex; flex-direction: column; border-left: 1px solid rgba(20,20,22,0.08);
    overflow-y: auto;
  }
  .side-empty {
    color: var(--muted-dark); font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-size: 1.1rem; margin-top: 1.5rem; line-height: 1.4;
  }
  .side-panel .eyebrow { color: var(--brass); margin-bottom: 0.65rem; }
  .side-name {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.75rem;
    font-weight: 500; line-height: 1.15; margin-bottom: 1.25rem; color: var(--near-black);
  }
  .meta-grid {
    display: grid; gap: 0.95rem; margin-bottom: 1.35rem; padding-bottom: 1.35rem;
    border-bottom: 1px solid rgba(26,25,23,0.12);
  }
  .meta-item label {
    display: block; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted-dark); margin-bottom: 0.25rem;
  }
  .meta-item span {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.15rem; color: var(--near-black);
  }
  .why-text { font-size: 0.88rem; color: rgba(26,25,23,0.72); line-height: 1.65; font-weight: 300; }
  .side-badge {
    display: inline-block; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--brass); border: 1px solid var(--brass-dim); padding: 0.25rem 0.55rem;
    border-radius: 100px; margin-bottom: 0.85rem;
  }
  .suite-essay {
    background: var(--paper); color: var(--near-black);
    border-top: 1px solid rgba(176,141,87,0.2);
  }
  .suite-essay .essay-inner { max-width: 900px; padding-top: 2.5rem; padding-bottom: 3.5rem; }
  .suite-essay .essay-title { font-size: clamp(1.6rem, 2.5vw, 2rem); }
  .suite-essay .btn-continue { color: var(--near-black); border-color: var(--near-black); }
  .suite-essay .btn-continue:hover { background: var(--near-black); color: var(--paper); }
  .term-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 0.75rem; margin: 1.15rem 0;
  }
  .term-card {
    padding: 0.95rem 1rem; background: rgba(20,20,22,0.03);
    border: 1px solid rgba(26,25,23,0.08); border-radius: 2px;
  }
  .term-card strong {
    display: block; font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.05rem; font-weight: 500; margin-bottom: 0.3rem; color: var(--near-black);
  }
  .term-card span { font-size: 0.82rem; color: rgba(26,25,23,0.68); line-height: 1.45; }
  .programme-box {
    margin: 1.25rem 0; padding: 1.35rem 1.5rem;
    border: 1px solid rgba(176,141,87,0.35); border-radius: 2px; background: #faf7f0;
  }
  .programme-box h4 {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.2rem;
    font-weight: 500; margin-bottom: 0.85rem; color: var(--near-black);
  }
  .programme-box ul { margin: 0; }
  .programme-box li { max-width: none; }
  .footprint-callout {
    display: grid; grid-template-columns: auto 1fr; gap: 1.25rem; align-items: center;
    padding: 1.25rem 1.4rem; margin: 1.15rem 0;
    background: var(--near-black); color: var(--paper); border-radius: 2px;
  }
  .footprint-callout .big {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.85rem;
    color: var(--brass); line-height: 1.1; white-space: nowrap;
  }
  .footprint-callout p {
    margin: 0 !important; color: var(--muted) !important;
    font-size: 0.88rem !important; max-width: none !important;
  }

  /* ISOLATION (preserved look) */
  .isolation {
    background: var(--graphite); display: flex; flex-direction: column;
    padding: 2rem 2.5rem 2rem;
  }
